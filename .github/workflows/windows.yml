name: Windows DLL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build DLL
        run: cmake --build build --config Release

      - name: Verify DLL
        shell: pwsh
        run: |
          if (!(Test-Path "build/Release/rolll.dll")) {
            throw "rolll.dll was not produced"
          }

          Get-Item "build/Release/rolll.dll"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: rolll-windows-x64
          path: build/Release/rolll.dll
          if-no-files-found: error
